                      "on-primary": "#ffffff",

                      "stack-sm": "0.5rem",

                      "container-margin": "1rem",
                      "stack-lg": "1.5rem",

              },
              "fontFamily": {
                      "body-sm": ["Inter"],
                      "headline-lg": ["Inter"],
                      "headline-md": ["Inter"],

              },
              "keyframes": {
                "shimmer": {
                  "0%": { "background-position": "0% 50%" },
                  "50%": { "background-position": "100% 50%" },
                  "100%": { "background-position": "0% 50%" }
                },
                "pill-entrance": {
                  "0%": { "opacity": "0", "transform": "translateY(10px)" },
                  "100%": { "opacity": "1", "transform": "translateY(0)" }
                }
              }
            },
          },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #faf8ff; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .chat-container { 
            height: calc(100vh - 140px); 
            background: linear-gradient(180deg, rgba(250, 248, 255, 0) 0%, rgba(236, 237, 253, 0.4) 100%);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Glitter border effect for input */
        .glitter-border-container {
            position: relative;
            padding: 2px;
            border-radius: 9999px;
            background: linear-gradient(90deg, #006c4f, #af3015, #00d09c, #ff9e88, #006c4f);
            background-size: 300% 300%;
            animation: shimmer 3s linear infinite;
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background">
<!-- Top Navigation Bar -->
<header class="bg-surface-container-low dark:bg-surface-container-highest flex justify-between items-center w-full px-container-margin py-stack-md sticky top-0 z-50">
<div class="flex items-center gap-stack-sm"><img alt="Groww" class="h-6 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpl7Gk8AvLkwLk8rmKYPyRyCeIf3_foLlJ-8DZuEnNDePrSiNYqQk_kY55Vu5sJJlze4Z7WULGEz52K2Ee5pr29-6tumhNPmAaWACsVtxUnjVvM0x6QNkT5xeXuqGfopKWLi8cYISd-WWaM8D4fMPJX-IA8gGn3AcWuIr3DhtdpJw_-lp1EXQ0y84WPSAOntoPlq6dl2u79wBLPJGH02wJ768amEP-ssRZUNPCiysC0s0cuNenAQhk28Fl3nK9FnzhqTxFrYMQoto"/></div>
<div class="flex gap-stack-md">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant transition-colors p-1 rounded-full" data-icon="info">info</button>
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant transition-colors p-1 rounded-full" data-icon="history">history</button>
</div>
</header>
<!-- Sticky Disclaimer Banner -->
<div class="sticky top-[64px] z-40 bg-tertiary-container text-on-tertiary-container px-container-margin py-stack-xs flex items-center justify-center gap-stack-xs shadow-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="verified_user">verified_user</span>
<span class="font-label-md text-label-md">Facts-only. No investment advice.</span>
</div>
<!-- Main Chat Canvas -->
<main class="chat-container overflow-y-auto px-container-margin pt-stack-lg pb-24 hide-scrollbar flex flex-col gap-stack-lg" id="chat-canvas">
<!-- Empty State -->
<section class="flex flex-col items-center mt-stack-lg" id="empty-state">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-stack-md shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-3xl" data-icon="smart_toy">smart_toy</span>
</div>
<h2 class="font-headline-sm text-headline-sm mb-stack-xs text-center">How can I help with Mutual Funds?</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg px-8 text-center">Ask about comparisons, exit loads, or taxes.</p>
<div class="w-full flex flex-col gap-stack-md">
<!-- Header with Magic Icon -->
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="auto_awesome">auto_awesome</span>
<h3 class="font-label-lg text-label-lg text-on-surface">A few ideas to get you started</h3>
</div>
<!-- Staggered Row Pills -->
<div class="flex flex-wrap gap-2"><button class="animate-pill-entrance px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full text-primary font-medium text-sm hover:bg-primary/5 transition-colors shadow-sm" onclick="sendQuickAction('What is an Exit Load?')">
                    What is an Exit Load?
                </button>
<button class="animate-pill-entrance [animation-delay:100ms] px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full text-tertiary font-medium text-sm hover:bg-tertiary/5 transition-colors shadow-sm" onclick="sendQuickAction('Compare ELSS vs Index Funds')">
                    Compare ELSS vs Index Funds
                </button>
<button class="animate-pill-entrance [animation-delay:200ms] px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full text-secondary font-medium text-sm hover:bg-secondary/5 transition-colors shadow-sm" onclick="sendQuickAction('How to start a SIP on Groww?')">
                    How to start a SIP on Groww?
                </button>
<button class="animate-pill-entrance [animation-delay:300ms] px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full text-primary font-medium text-sm hover:bg-primary/5 transition-colors shadow-sm" onclick="sendQuickAction('Tax on Equity Funds?')">
                    Tax on Equity Funds?
                </button>
<button class="animate-pill-entrance [animation-delay:400ms] px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full text-tertiary font-medium text-sm hover:bg-tertiary/5 transition-colors shadow-sm" onclick="sendQuickAction('Best Small Cap Funds 2024')">
                    Best Small Cap Funds 2024
                </button></div>
</div>
</section>
<!-- Chat History -->
<div class="hidden flex flex-col gap-stack-lg w-full" id="chat-flow">
<!-- Messages will be injected here -->
</div>
</main>
<!-- Bottom Input Bar -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface px-4 py-4 border-t border-outline-variant">
<div class="flex items-center gap-stack-sm max-w-screen-xl mx-auto">
<div class="flex-grow glitter-border-container">
<div class="bg-surface-container-lowest rounded-full px-4 py-2 flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="search">search</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/60" id="chat-input" placeholder="Ask about funds, NAV, or taxes..." type="text"/>
</div>
</div>
<button class="bg-primary hover:bg-on-primary-fixed-variant text-on-primary w-11 h-11 rounded-full flex items-center justify-center transition-all active:scale-90 shadow-md flex-shrink-0" id="send-btn" onclick="handleSend()">
<span class="material-symbols-outlined" data-icon="send" data-weight="fill">send</span>
</button>
</div>
</footer>
<script>
    const chatInput = document.getElementById('chat-input');
    const emptyState = document.getElementById('empty-state');
    const chatFlow = document.getElementById('chat-flow');
    const canvas = document.getElementById('chat-canvas');

    function handleSend() {
        const val = chatInput.value.trim();
        if (val) {
            renderUserMessage(val);
            chatInput.value = '';
            setTimeout(() => {
                renderAssistantPlaceholder();
            }, 600);
        }
    }

    function sendQuickAction(text) {
        renderUserMessage(text);
        setTimeout(() => {
            renderAssistantPlaceholder();
        }, 600);
    }

    function renderUserMessage(text) {
        emptyState.classList.add('hidden');
        chatFlow.classList.remove('hidden');
        
        const msgDiv = document.createElement('div');
        msgDiv.className = 'flex justify-end w-full animate-in fade-in slide-in-from-right-4 duration-300';
        msgDiv.innerHTML = `
            <div class="max-w-[85%] bg-primary text-on-primary p-stack-md rounded-xl rounded-tr-none shadow-sm">
                <p class="font-body-md text-body-md">${text}</p>
            </div>
        `;
        chatFlow.appendChild(msgDiv);
        canvas.scrollTo({ top: canvas.scrollHeight, behavior: 'smooth' });
    }

    function renderAssistantPlaceholder() {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'flex justify-start w-full animate-in fade-in slide-in-from-left-4 duration-300';
        msgDiv.innerHTML = `
            <div class="max-w-[90%] bg-surface-variant text-on-surface-variant p-stack-md rounded-xl rounded-tl-none border border-outline-variant">
                <div class="flex items-center gap-stack-sm mb-stack-sm">
                    <span class="material-symbols-outlined text-primary text-sm animate-pulse" data-icon="auto_awesome">auto_awesome</span>
                    <span class="font-label-md text-label-md text-primary uppercase tracking-wider">Assistant is thinking...</span>
                </div>
                <div class="h-4 bg-on-surface-variant/10 rounded w-3/4 mb-2 animate-pulse"></div>
                <div class="h-4 bg-on-surface-variant/10 rounded w-1/2 animate-pulse"></div>
            </div>
        `;
        chatFlow.appendChild(msgDiv);
        canvas.scrollTo({ top: canvas.scrollHeight, behavior: 'smooth' });
    }

    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
</script>
</body></html>
