name: Daily Mutual Fund Data Sync

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at midnight (UTC)
  workflow_dispatch: # Allow manual triggers from GitHub Actions UI

permissions:
  contents: write # Allows the workflow to push commits back to the repository

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run ETL Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/run_etl.py

      - name: Commit and push scraped data updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          # Check if there are changes before committing
          if [ -n "$(git status --porcelain data/raw/)" ]; then
            git commit -m "Automated daily scrape update [skip ci]"
            git push origin development
          else
            echo "No data changes detected. Skipping commit."
          fi
